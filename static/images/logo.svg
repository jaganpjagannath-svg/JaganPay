<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="35%" stop-color="#1d4ed8" />
      <stop offset="70%" stop-color="#0284c7" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#93c5fd" stop-opacity="0.85" />
      <stop offset="50%" stop-color="#c084fc" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#22d3ee" stop-opacity="0.95" />
    </linearGradient>

    <linearGradient id="boltGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="60%" stop-color="#f0fdfa" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <linearGradient id="jGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#818cf8" />
    </linearGradient>

    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#0284c7" flood-opacity="0.45" />
    </filter>

    <filter id="boltGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0369a1" flood-opacity="0.5" />
    </filter>
  </defs>

  <!-- Outer Rounded Squircle with Drop Shadow -->
  <rect x="36" y="36" width="440" height="440" rx="116" fill="url(#bgGrad)" filter="url(#shadow)" />
  <rect x="36" y="36" width="440" height="440" rx="116" fill="none" stroke="url(#rimGrad)" stroke-width="6" />

  <!-- Stylized Monogram "J" (Left Arc) -->
  <path d="M 210 145 V 300 C 210 350, 168 375, 128 350 C 104 335, 96 308, 98 285" 
        fill="none" stroke="url(#jGrad)" stroke-width="32" stroke-linecap="round" stroke-linejoin="round" opacity="0.95" />

  <!-- Central Dynamic Lightning Payment Bolt ("P" & Speed) -->
  <path d="M 300 90 L 175 250 H 265 L 220 415 L 365 225 H 280 L 340 90 Z" 
        fill="url(#boltGrad)" filter="url(#boltGlow)" />

  <!-- Top Right Sparkle Star -->
  <path d="M 390 105 Q 390 128 368 128 Q 390 128 390 150 Q 390 128 412 128 Q 390 128 390 105 Z" 
        fill="#38bdf8" />
  <circle cx="390" cy="128" r="4" fill="#ffffff" />
</svg>