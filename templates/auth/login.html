{% extends "base.html" %}

{% block title %}Sign In — JaganPay Simulator{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <div class="glass-card p-8 shadow-2xl">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-blue-600 to-purple-600 flex items-center justify-center mx-auto mb-3 shadow-lg shadow-blue-500/20">
                <i class="fas fa-lock text-white text-lg"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Welcome Back</h2>
            <p class="text-xs text-slate-400 mt-1">Sign in to your JaganPay demo account</p>
        </div>

        <form method="POST" action="{{ url_for('auth.login') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div>
                <label for="identifier" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Email or Phone</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                        <i class="fas fa-envelope text-sm"></i>
                    </span>
                    <input type="text" id="identifier" name="identifier" required placeholder="user@jaganpay.com" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 text-sm">
                </div>
            </div>

            <div>
                <label for="password" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1.5">Password</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none text-slate-500">
                        <i class="fas fa-key text-sm"></i>
                    </span>
                    <input type="password" id="password" name="password" required placeholder="••••••••••••" class="w-full pl-10 pr-4 py-2.5 rounded-xl bg-slate-900/90 border border-slate-700 text-white placeholder-slate-500 focus:outline-none focus:border-cyan-400 text-sm">
                </div>
            </div>

            <button type="submit" class="w-full btn-jaganpay py-3 text-sm flex items-center justify-center gap-2 mt-2">
                <span>Sign In Securely</span>
                <i class="fas fa-arrow-right text-xs"></i>
            </button>
        </form>

        <!-- QUICK FILL SEEDED ACCOUNTS -->
        <div class="mt-6 pt-6 border-t border-slate-800">
            <div class="text-[11px] font-semibold text-slate-400 uppercase tracking-wider text-center mb-2.5">
                ⚡ Quick Fill Demo Accounts
            </div>
            <div class="grid grid-cols-3 gap-2">
                <button type="button" onclick="fillDemo('jagan@jaganpay.com', 'DemoPassword123!')" class="py-1.5 px-2 bg-purple-950/60 hover:bg-purple-900/80 border border-purple-500/30 rounded-lg text-[11px] font-medium text-purple-200 transition-colors">
                    Admin
                </button>
                <button type="button" onclick="fillDemo('demo@jaganpay.com', 'DemoPassword123!')" class="py-1.5 px-2 bg-blue-950/60 hover:bg-blue-900/80 border border-blue-500/30 rounded-lg text-[11px] font-medium text-blue-200 transition-colors">
                    Demo User
                </button>
                <button type="button" onclick="fillDemo('jagancafe@jaganpay.com', 'DemoPassword123!')" class="py-1.5 px-2 bg-emerald-950/60 hover:bg-emerald-900/80 border border-emerald-500/30 rounded-lg text-[11px] font-medium text-emerald-200 transition-colors">
                    Merchant
                </button>
            </div>
        </div>

        <div class="mt-6 text-center text-xs text-slate-400">
            Don't have a demo account?
            <a href="{{ url_for('auth.register') }}" class="text-cyan-400 font-semibold hover:underline ml-1">Create one</a>
        </div>
    </div>
</div>

<script>
function fillDemo(email, pass) {
    document.getElementById('identifier').value = email;
    document.getElementById('password').value = pass;
    showToast('Credentials filled for ' + email, 'info');
}
</script>
{% endblock %}
