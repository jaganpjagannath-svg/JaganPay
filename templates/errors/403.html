{% extends "base.html" %}

{% block title %}403 — Access Denied | JaganPay{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-20 text-center">
    <div class="w-16 h-16 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mx-auto mb-4 text-rose-400 text-2xl">
        <i class="fas fa-hand"></i>
    </div>
    <h1 class="text-3xl font-black text-white">403</h1>
    <h2 class="text-base font-bold text-slate-300 mt-1">Permission Denied</h2>
    <p class="text-xs text-slate-400 mt-2">
        You do not have the required administrative or merchant permissions to access this view.
    </p>
    <a href="{{ url_for('dashboard.index') }}" class="btn-jaganpay inline-flex items-center gap-1.5 text-xs mt-6 px-6 py-2.5">
        <span>Back to Dashboard</span>
        <i class="fas fa-arrow-right text-[10px]"></i>
    </a>
</div>
{% endblock %}
