{% extends "base.html" %}

{% block title %}429 — Rate Limit Exceeded | JaganPay{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-20 text-center">
    <div class="w-16 h-16 rounded-2xl bg-slate-900 border border-slate-800 flex items-center justify-center mx-auto mb-4 text-cyan-400 text-2xl">
        <i class="fas fa-hourglass-half"></i>
    </div>
    <h1 class="text-3xl font-black text-white">429</h1>
    <h2 class="text-base font-bold text-slate-300 mt-1">Rate Limit Exceeded</h2>
    <p class="text-xs text-slate-400 mt-2">
        Too many requests were detected in a short time window. Please wait a few moments before retrying.
    </p>
    <a href="{{ url_for('dashboard.index') if current_user.is_authenticated else url_for('main.index') }}" class="btn-jaganpay inline-flex items-center gap-1.5 text-xs mt-6 px-6 py-2.5">
        <span>Go Back</span>
        <i class="fas fa-arrow-right text-[10px]"></i>
    </a>
</div>
{% endblock %}
