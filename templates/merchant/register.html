{% extends "base.html" %}

{% block title %}Register Merchant — JaganPay Simulator{% endblock %}

{% block content %}
<div class="max-w-md mx-auto px-4 py-12">
    <div class="glass-card p-8 shadow-2xl">
        <div class="text-center mb-6">
            <div class="w-12 h-12 rounded-2xl bg-gradient-to-tr from-emerald-600 to-cyan-600 flex items-center justify-center mx-auto mb-3 text-white shadow-lg">
                <i class="fas fa-store text-lg"></i>
            </div>
            <h2 class="text-2xl font-bold text-white">Merchant Onboarding</h2>
            <p class="text-xs text-slate-400 mt-1">Accept simulated customer QR payments for your business</p>
        </div>

        <form method="POST" action="{{ url_for('merchant.register_merchant') }}" class="space-y-4">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}"/>

            <div>
                <label for="business_name" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Business Name</label>
                <input type="text" id="business_name" name="business_name" required placeholder="e.g. Jagan Cafe" class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs focus:outline-none focus:border-cyan-400">
            </div>

            <div>
                <label for="category" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Category</label>
                <select id="category" name="category" class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs focus:outline-none focus:border-cyan-400">
                    <option value="Food & Dining">Food & Dining</option>
                    <option value="Retail & Shopping">Retail & Shopping</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Services & Education">Services & Education</option>
                </select>
            </div>

            <div>
                <label for="location" class="block text-xs font-semibold text-slate-300 uppercase tracking-wider mb-1">Store Location</label>
                <input type="text" id="location" name="location" required placeholder="e.g. Cyber Gateway, Hyderabad" class="w-full px-3 py-2.5 rounded-xl bg-slate-900 border border-slate-700 text-white text-xs focus:outline-none focus:border-cyan-400">
            </div>

            <button type="submit" class="w-full btn-jaganpay py-2.5 text-xs flex items-center justify-center gap-2 mt-2">
                <span>Activate Merchant Profile</span>
                <i class="fas fa-arrow-right text-[10px]"></i>
            </button>
        </form>
    </div>
</div>
{% endblock %}
